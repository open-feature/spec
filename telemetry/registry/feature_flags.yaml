file_format: definition/2

# Native fields define the event; annotations describe OpenFeature source mappings.
event_refinements:
  - id: feature_flag.evaluation
    ref: feature_flag.evaluation
    annotations:
      openfeature:
        source_headings:
          evaluation: Source Field or Derived Value from Evaluation Details
          flag_metadata: Flag Metadata Key
          provider_metadata: Provider Metadata Field
    attributes:
      - ref: feature_flag.key
        annotations:
          openfeature:
            section: evaluation
            source: flag key
            notes: "See: [flag key](./glossary.md#flag-key)"
      - ref: feature_flag.result.variant
        note: >-
          The `variant` field should be included whenever possible as it represents the symbolic name of the flag's returned value (e.g., "on"/"off", "control"/"treatment"). Only omit if the provider doesn't supply this information.
        annotations:
          openfeature:
            section: evaluation
            source: variant
            notes: "See: [variant](./glossary.md#variant)"
      - ref: feature_flag.result.value
        requirement_level:
          conditionally_required: If a variant is not available. Otherwise, recommended.
        note: >-
          Considerations should be made for large and/or sensitive values, which should be redacted or omitted prior to being captured in telemetry signals.
        annotations:
          openfeature:
            section: evaluation
            source: value
            notes: "See: [value](./glossary.md#values)"
      - ref: feature_flag.result.reason
        annotations:
          openfeature:
            section: evaluation
            source: reason
            notes: "See: [reason](./types.md#resolution-reason)"
      - ref: error.type
        annotations:
          openfeature:
            section: evaluation
            source: error code
            notes: "See: [error code](./types.md#error-code)"
      - ref: feature_flag.error.message
        requirement_level:
          conditionally_required: If and only if an error occurred during flag evaluation.
        annotations:
          openfeature:
            section: evaluation
            source: error message
            notes: >-
              For programmatic purposes, refer to [error code](./types.md#error-code).
      - ref: feature_flag.context.id
        annotations:
          openfeature:
            section: flag_metadata
            source: contextId
            notes: >-
              The context identifier returned in the flag metadata uniquely identifies the subject of the flag evaluation. If not available, the [targeting key](./glossary.md#targeting-key) should be used.
      - ref: feature_flag.set.id
        annotations:
          openfeature:
            section: flag_metadata
            source: flagSetId
            notes: "A logical identifier for the [flag set](./glossary.md#flag-set)."
      - ref: feature_flag.version
        annotations:
          openfeature:
            section: flag_metadata
            source: version
            notes: "A version string (format unspecified) for the flag or [flag set](./glossary.md#flag-set)."
      - ref: feature_flag.provider.name
        annotations:
          openfeature:
            section: provider_metadata
            source: name
            notes: >-
              The name of the provider as defined in the `provider metadata`, available in the `hook context`.
